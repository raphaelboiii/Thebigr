  <style>
    #homestuff { display:flex; flex-direction:column; align-items:center; gap:20px; text-align:center; min-height:60vh; justify-content:center; }
    .search-container { display:flex; gap:8px; justify-content:center; align-items:center; width:100%; max-width:560px; }
    .search-container input { flex:1; background:#022c3a; color:#b1e8fc; border:none; border-radius:10px; padding:0.8em 1.5em; font-family:Outfit,sans-serif; font-size:1.1em; outline:none; }
    .search-container input::placeholder { color:#066b99; }
    .search-container input:focus { box-shadow:0 0 0 2px #00eaff; }
    /* BigR branded home surface */
    .brand-banner {
      width: min(960px, calc(100% - 18px));
      margin: 28px auto 10px;
      padding: 28px 24px 18px;
      border-radius: 30px;
      background: rgba(7, 14, 25, 0.72);
      border: 1px solid rgba(135, 208, 255, 0.14);
      box-shadow: 0 18px 40px rgba(0,0,0,0.2);
      text-align: center;
    }
    .brand-banner h1 {
      margin: 0 0 10px;
      font-size: clamp(2.4rem, 6vw, 4.4rem);
      letter-spacing: -0.06em;
      line-height: 0.95;
    }
    .brand-banner p {
      margin: 0 auto;
      max-width: 700px;
      color: #b2d0ea;
      font-size: 1.05rem;
      line-height: 1.7;
    }
    .brand-banner .cta-row { display:flex; justify-content:center; gap:14px; flex-wrap:wrap; margin-top:22px; }
    .brand-banner .cta { display:inline-flex; align-items:center; justify-content:center; min-height:46px; padding:0.8rem 1.2rem; border-radius:12px; border:1px solid transparent; font-weight:700; }
    .brand-banner .cta.primary { background: linear-gradient(135deg, #7bd8ff, #64f0c8); color:#081120; }
    .brand-banner .cta.secondary { background: rgba(9, 15, 27, 0.7); color:#edf7ff; border-color: rgba(123,216,255,0.2); }
  </style>
    <div class="brand-banner">
      <h1>BigR Games</h1>
      <p>Arcade, sports, action, retro and browser favorites — all in one cleaner, faster gaming portal.</p>
      <div class="cta-row">
        <a href="select.html" class="cta primary">Browse games</a>
        <a href="launch.html" class="cta secondary">Open launcher</a>
      </div>
    </div>
    <div id="homestuff">
      <div class="search-container">
        <input id="searchInput" type="text" placeholder="Search a game..." aria-label="Search games">
      </div>
      <button class="button" onclick="window.location.href='select.html'">Enter the game library</button>
    </div>
    <script>
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.addEventListener('keydown', function (event) {
          if (event.key === 'Enter') {
            const term = (searchInput.value || '').trim().toLowerCase();
            if (!term) return;
            window.location.href = 'select.html';
          }
        });
      }
    </script>
  </body>
